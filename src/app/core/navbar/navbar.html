<nav class="wrap py-6 flex justify-between items-center relative z-20">
  <a href="#" class="font-mono text-white font-bold">
    &lt;agus<span class="text-rose-400">.dev</span> /&gt;
  </a>

  <!-- Desktop -->
  <div class="hidden md:flex gap-8 text-sm font-mono">
    @for (link of links; track link.id; let i = $index) {
      <a [href]="'#' + link.id" class="hover:text-rose-400 transition-colors">
        <span class="text-rose-400">0{{ i + 1 }}.</span> {{ link.label }}
      </a>
    }
  </div>

  <!-- Botón mobile -->
  <button type="button" class="md:hidden font-mono text-sm text-white border border-white/15 px-3 py-1.5"
          (click)="open.set(!open())" [attr.aria-expanded]="open()" aria-controls="mobile-menu">
    {{ open() ? 'cerrar ✕' : 'menú ☰' }}
  </button>
</nav>

<!-- Menú mobile -->
@if (open()) {
  <div id="mobile-menu" class="md:hidden wrap pb-6 relative z-20">
    <div class="border border-white/10 bg-ink-2 flex flex-col font-mono">
      @for (link of links; track link.id; let i = $index) {
        <a [href]="'#' + link.id" (click)="open.set(false)"
           class="px-5 py-4 border-b border-white/5 last:border-0 hover:bg-white/5">
          <span class="text-rose-400">0{{ i + 1 }}.</span> {{ link.label }}
        </a>
      }
    </div>
  </div>
}
