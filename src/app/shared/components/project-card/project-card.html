@let p = project();

<article class="project h-full flex flex-col" [style.--pc]="p.color">
  <app-project-preview [project]="p" />

  <div class="p-5 flex flex-col flex-1">
    <div class="flex items-baseline justify-between gap-3">
      <h3 class="text-xl font-bold text-white tracking-tight">{{ p.name }}</h3>
      <span class="font-mono text-[11px]" [style.color]="p.color">{{ p.tag }}</span>
    </div>
    <p class="text-slate-400 mt-2 text-[15px] leading-relaxed">{{ p.description }}</p>

    <app-chip-list [items]="p.stack" [small]="true" class="block mt-4" />

    <div class="flex gap-6 mt-auto pt-5 text-sm font-medium">
      @for (link of p.links; track link.url) {
        <a [href]="link.url" target="_blank" rel="noopener" class="link">{{ link.label }}</a>
      }
    </div>
  </div>
</article>
