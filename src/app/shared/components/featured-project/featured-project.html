@let p = project();

<article class="project grid md:grid-cols-[1.25fr_1fr]" [style.--pc]="p.color">
  <app-project-preview [project]="p" class="self-center" />

  <div class="p-6 md:p-8 flex flex-col justify-center">
    <p class="font-mono text-xs" [style.color]="p.color">{{ p.meta }}</p>
    <h3 class="text-3xl font-bold text-white mt-2 tracking-tight">{{ p.name }}</h3>
    <p class="text-slate-300 mt-1">{{ p.subtitle }}</p>
    <p class="text-slate-400 mt-4 text-[15px] leading-relaxed">{{ p.description }}</p>

    <app-chip-list [items]="p.stack" class="block mt-5" />

    <div class="flex gap-6 mt-6 text-sm font-medium">
      @for (link of p.links; track link.url) {
        <a [href]="link.url" target="_blank" rel="noopener" class="link">{{ link.label }}</a>
      }
    </div>
  </div>
</article>
